# The GitHub runner's entry, without its version and digests (docs/spec-runner-app.md
# §2 in LehrNAS; the format is spec-app-catalog §3). tools/release.py, run by
# release.yml, fills the version, the day, compose.yaml's tag and hash and the
# digests, and writes the result into the catalog; everything else is edited
# here, by hand.
[[apps]]
id = "gha-runner"
name = "Runner for GitHub Actions"
summary = "Runs your own repositories' GitHub Actions jobs on this box, one at a time unless you raise the number."
group = "Development"
version = ""
released = ""
# By path, not inline: a box parses inline compose while reading the catalog, and
# one key it doesn't know (stop_grace_period, on a box older than this app) would
# refuse the whole file, every other app with it. By path, only this app's install
# fails. The signature covers the hash.
compose_path = "apps/gha-runner/compose.yaml"
compose_sha256 = ""
# Both services pin one manifest list, in a public repository (§2).
[[apps.images]]
service = "broker"
image = "docker.io/eshork/gha-runner"
list = ""
amd64 = ""
arm64 = ""
[[apps.images]]
service = "runner"
image = "docker.io/eshork/gha-runner"
list = ""
amd64 = ""
arm64 = ""
# Several runners at once (§17.2; spec-apps §7.1): the number is the box's, on
# the app's card. `slot` holds each runner's folder, where its config is handed
# over and its stop marker goes. A runner ends itself after every job. An older
# box ignores this block and runs one runner. The help is the page's warning too.
[apps.scale.runner]
help = "Jobs running together can read each other's files in /cache, /dev/shm and shares, and share localhost, so fixed ports clash. Use more than one only for repositories that trust each other."
per_instance = ["slot"]
ends_itself = true
[apps.requirements]
mem_mib = 4096
cpus = 2
[apps.permissions]
ports = ["8711:8711/tcp"]
shares = "none by default; a public repository refuses read-write"
internet = true
lan = false
[apps.limits]
cpu_weight = 20
[[apps.data]]
name = "config"
bytes = 67108864
[[apps.data]]
name = "cache"
bytes = 21474836480
[apps.user]
kind = "default app user"
[apps.settings.GITHUB_TOKEN]
help = "A fine-grained personal access token, not the registration token from GitHub's Add runner page. Give it Self-hosted runners: write for an organisation, or Administration: write for one repository. Administration: write is broad, so use an organisation if you have one."
secret = true
generate = false
[apps.settings.RUNNER_SCOPE]
help = "Where the runner takes jobs from: owner/repository for one repository, or org/<organisation>/<runner group> for an organisation's runner group. It isn't a secret."
secret = false
generate = false

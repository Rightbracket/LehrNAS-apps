[package]
name = "gha-runner-broker"
version = "0.1.0"
description = "The GitHub runner app's broker: one just-in-time runner at a time, and its status page"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false

[dependencies]
argon2 = { version = "0.6.0", features = ["password-hash", "getrandom"] }
axum = "0.8.9"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"

# Its own workspace: this repository has no root manifest.
[workspace]

# Every push and pull request: the catalog parses by the box's rules and
# its signature verifies with the key beside it (tools/check.py).
name: check
on:
  push:
  pull_request:
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: sigstore/cosign-installer@v3
      - name: check every catalog file
        run: |
          set -eu
          # Catalogs only: an app's folder holds its own template and manifests.
          files=$(git ls-files '*.toml' | grep -v -E '^(tools|apps)/' || true)
          if [ -z "$files" ]; then echo "no catalog files"; exit 1; fi
          # shellcheck disable=SC2086
          python3 tools/check.py $files
      - name: the entry templates, filled with placeholder digests
        run: python3 tools/check_template.py apps/gha-runner/channel-entry.toml

  gha-runner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gha-runner/broker
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml; clippy and rustfmt come with it.
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: the runner's start script
        working-directory: .
        run: apps/gha-runner/smoke.sh

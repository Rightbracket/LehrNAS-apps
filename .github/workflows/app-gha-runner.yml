# The GitHub runner app: its CI when its folder, the tools or the shared
# workflows change, and on main its release, built and signed on our own
# runner (app.yml and release.yml; LehrNAS #268, spec-runner-app.md §18.8).
name: app-gha-runner
on:
  push:
    paths:
      - apps/gha-runner/**
      - tools/**
      - .github/workflows/app-gha-runner.yml
      - .github/workflows/app.yml
      - .github/workflows/release.yml
  # A rebuild by hand, from main alone (release.yml's plan refuses another
  # branch): it takes the named apt packages' updates. The base images are
  # pinned by digest, so their updates come only with a change to the
  # Dockerfile's digests, which a push then releases.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci:
    uses: ./.github/workflows/app.yml
    with:
      app: gha-runner
      rust: src/broker
      tests: tests/smoke.sh
  # In this repository alone, so a copy of it never runs the official release.
  # A push releases only when the app or the tool changed since its last tag.
  release:
    needs: ci
    if: github.repository == 'Rightbracket/LehrNAS-apps' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release.yml
    # One release of this app at a time, plan to publish, as far as GitHub
    # applies a caller job's group to the jobs it calls (its pages don't
    # say; no two runs have overlapped yet): the build picks the tag, so two
    # builds before either publish would pick the same one, and the second
    # would be refused.
    # Up to 100 wait, none cancelled; GitHub's default queue keeps one and
    # cancels it when a third arrives.
    concurrency:
      group: release-gha-runner
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      actions: read
      deployments: read
    with:
      app: gha-runner
      catalog: official.toml
      # The key, its password and the Docker Hub token are app-channel's,
      # which admits main alone; release.yml's publish job reads them there.
      # A called job gets an environment's secret only for a name its
      # caller passes; `inherit` passes them all. It would also hand over
      # any repository or organisation secret, so release.yml's plan refuses
      # the run while there is one.
      environment: app-channel
    secrets: inherit

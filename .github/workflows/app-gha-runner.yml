# The GitHub runner app: its CI when its folder, the tools or the shared
# workflows change, and on main its release, built and signed on our own
# runner (app.yml and release.yml; LehrNAS #268, spec-runner-app.md §18.8).
name: app-gha-runner
on:
  push:
    paths:
      - apps/gha-runner/**
      - tools/**
      - .github/workflows/app-gha-runner.yml
      - .github/workflows/app.yml
      - .github/workflows/release.yml
  # A rebuild by hand, from main alone (release.yml's plan refuses another
  # branch): it takes the base image's and the packages' updates.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci:
    uses: ./.github/workflows/app.yml
    with:
      app: gha-runner
      rust: src/broker
      tests: tests/smoke.sh
  # In this repository alone, so a copy of it never runs the official release.
  # A push releases only when the app or the tool changed since its last tag.
  release:
    needs: ci
    if: github.repository == 'Rightbracket/LehrNAS-apps' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      actions: read
      deployments: read
    with:
      app: gha-runner
      catalog: official.toml
      # The key, its password and the Docker Hub token are app-channel's,
      # which admits main alone; release.yml's publish job reads them there.
      # This job has no environment to pass them from; `inherit` is what
      # lets the called job read its environment's. The repository has no
      # other secrets, so it hands over nothing else.
      environment: app-channel
    secrets: inherit

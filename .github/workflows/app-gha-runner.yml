# The GitHub runner app, only when its folder or the tools change.
name: app-gha-runner
on:
  push:
    paths:
      - apps/gha-runner/**
      - tools/**
      - .github/workflows/app-gha-runner.yml
jobs:
  gha-runner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gha-runner/src/broker
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml; clippy and rustfmt come with it.
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: the runner's start script
        working-directory: .
        run: apps/gha-runner/tests/smoke.sh

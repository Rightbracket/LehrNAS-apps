# The official LehrNAS app catalog: the apps LehrNAS publishes itself, each
# pinned to the digests of one release. Signed: official.toml.sig is the
# app-channel key's signature over this file's bytes (cosign sign-blob; the
# public key is app-channel.pub beside it, and every LehrNAS box ships it).
# Entries are written by each app's release command, never by hand.
[channel]
name = "LehrNAS official"
# Where a box fetches it (online only); the signature and the key are
# fetched from beside it.
url = "https://raw.githubusercontent.com/Rightbracket/LehrNAS-apps/main/official.toml"
key = "app-channel.pub"

# FileFerry's entry in the official channel (spec-fileferry §8.3; the
# format is spec-app-catalog §3). `lehrdev fileferry release` fills the
# version, the day and the digests and writes the result into official.toml
# in the LehrNAS-apps repository (#209); everything else is edited here, by hand.

[[apps]]
id = "fileferry"
name = "FileFerry"
summary = "Moves an old NAS's files into LehrNAS shares, verified from the drive."
group = "Moving in"
version = "fileferry-2026.1106.2"
released = "2026-11-06"
# The image's repository on Docker Hub, public (spec-fileferry §8.4).
image = "docker.io/eshork/fileferry"
# What the box pins (spec-apps §1): the manifest list's digest, which podman
# records beside the arch's own, so either one matches at install.
[apps.digests]
list = "sha256:83e26f1b28ad1e80018a814dc1d21fed21a7286ffa2798a4b1094ab64be6891a"
amd64 = "sha256:cbd39226f09db50c070ef23da9b95da1da6542d1d1f4db4a81a76ce80689481f"
arm64 = "sha256:d256bfb2129969b4f4617fb6da054203ad0ef1b7624b13bbc55eb02994a267ba"
[apps.requirements]
mem_mib = 1024
cpus = 2
[apps.permissions]
# LAN port:container port, the form the box publishes (#210).
ports = ["8700:8700/tcp"]
shares = "read-write, chosen at install"
internet = false
required = ["shares"]
[[apps.data]]
name = "config"
bytes = 8589934592
[apps.user]
kind = "default app user"

# The GitHub runner's entry, without its version and digests (docs/spec-runner-app.md
# §2 in LehrNAS; the format is spec-app-catalog §3). `lehrdev runner release` fills
# the version, the day, compose.yaml's tag and hash and the digests, and writes the result into
# official.toml; everything else is edited here, by hand.

# The GitHub runner's entry, without its version and digests (docs/spec-runner-app.md
# §2 in LehrNAS; the format is spec-app-catalog §3). `lehrdev runner release` fills
# the version, the day, compose.yaml's tag and hash and the digests, and writes the result into
# official.toml; everything else is edited here, by hand.

# The GitHub runner's entry, without its version and digests (docs/spec-runner-app.md
# §2 in LehrNAS; the format is spec-app-catalog §3). `lehrdev runner release` fills
# the version, the day, compose.yaml's tag and hash and the digests, and writes the result into
# official.toml; everything else is edited here, by hand.
[[apps]]
id = "gha-runner"
name = "Runner for GitHub Actions"
summary = "Runs your own repositories' GitHub Actions jobs on this box, one at a time unless you raise the number."
group = "Development"
version = "gha-runner-2026.1114.1"
released = "2026-11-13"
# By path, not inline: a box parses inline compose while reading the catalog, and
# one key it doesn't know (stop_grace_period, on a box older than this app) would
# refuse the whole file, every other app with it. By path, only this app's install
# fails. The signature covers the hash.
compose_path = "apps/gha-runner/compose.yaml"
compose_sha256 = "18364b20de08ef40aace96795edf2635bf268ef0654e99be884f49bd9d7546dc"
# Both services pin one manifest list, in a public repository (§2).
[[apps.images]]
service = "broker"
image = "docker.io/eshork/gha-runner"
list = "sha256:76d4c6d2e1f7f4fdff9989e89ee9630dafc69f78d5aa2e859aeb8c3e98a7c07e"
amd64 = "sha256:3299758e28b77df06e16cf9cc2a6b4a5ffe7637b004c87c90cce3e85a3feb607"
arm64 = "sha256:62572175d1a3129ab5dfca18814eefdcd0114fb955b62e9b7f408a051ca6f8f1"
[[apps.images]]
service = "runner"
image = "docker.io/eshork/gha-runner"
list = "sha256:76d4c6d2e1f7f4fdff9989e89ee9630dafc69f78d5aa2e859aeb8c3e98a7c07e"
amd64 = "sha256:3299758e28b77df06e16cf9cc2a6b4a5ffe7637b004c87c90cce3e85a3feb607"
arm64 = "sha256:62572175d1a3129ab5dfca18814eefdcd0114fb955b62e9b7f408a051ca6f8f1"
# Several runners at once (§17.2; spec-apps §7.1): the number is the box's, on
# the app's card. `slot` holds each runner's folder, where its config is handed
# over and its stop marker goes. A runner ends itself after every job. An older
# box ignores this block and runs one runner. The help is the page's warning too.
[apps.scale.runner]
help = "Jobs running together can read each other's files in /cache, /dev/shm and shares, and share localhost, so fixed ports clash. Use more than one only for repositories that trust each other."
per_instance = ["slot"]
ends_itself = true
[apps.requirements]
mem_mib = 4096
cpus = 2
[apps.permissions]
ports = ["8711:8711/tcp"]
shares = "none by default; a public repository refuses read-write"
internet = true
lan = false
[apps.limits]
cpu_weight = 20
[[apps.data]]
name = "config"
bytes = 67108864
[[apps.data]]
name = "cache"
bytes = 21474836480
[apps.user]
kind = "default app user"
[apps.settings.GITHUB_TOKEN]
help = "A fine-grained personal access token, not the registration token from GitHub's Add runner page. Give it Self-hosted runners: write for an organisation, or Administration: write for one repository. Administration: write is broad, so use an organisation if you have one."
secret = true
generate = false
[apps.settings.RUNNER_SCOPE]
help = "Where the runner takes jobs from: owner/repository for one repository, or org/<organisation>/<runner group> for an organisation's runner group. It isn't a secret."
secret = false
generate = false

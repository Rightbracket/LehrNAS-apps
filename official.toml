# The official LehrNAS app catalog: the apps LehrNAS publishes itself, each
# pinned to the digests of one release. Signed: official.toml.sig is the
# app-channel key's signature over this file's bytes (cosign sign-blob; the
# public key is app-channel.pub beside it, and every LehrNAS box ships it).
# Entries are written by each app's release command, never by hand.
[channel]
name = "LehrNAS official"
# Where a box fetches it (online only); the signature and the key are
# fetched from beside it.
url = "https://raw.githubusercontent.com/Rightbracket/LehrNAS-apps/main/official.toml"
key = "app-channel.pub"

# FileFerry's entry in the official channel (spec-fileferry §8.3; the
# format is spec-app-catalog §3). `lehrdev fileferry release` fills the
# version, the day and the digests and writes the result into official.toml
# in the LehrNAS-apps repository (#209); everything else is edited here, by hand.

[[apps]]
id = "gha-runner"
name = "Runner for GitHub Actions"
summary = "Runs your own repositories' GitHub Actions jobs on this box, one at a time."
group = "Development"
version = "gha-runner-2026.1106.1"
released = "2026-11-06"
# By path, not inline: a box parses inline compose while reading the catalog, and
# one key it doesn't know (stop_grace_period, on a box older than this app) would
# refuse the whole file, every other app with it. By path, only this app's install
# fails. The signature covers the hash.
compose_path = "apps/gha-runner/compose.yaml"
compose_sha256 = "edbb854bc5038bc74fdecf88c40cd79f5a7af5a3572d1037c553afeadbae069d"
# Both services pin one manifest list, in a public repository: the free tier's
# one private slot is FileFerry's, and this image holds nothing private (§2).
[[apps.images]]
service = "broker"
image = "docker.io/eshork/gha-runner"
list = "sha256:d7d6057c02f60b1dcddeaee2f0d7193af329d65e676e4040c735f425ee7d9fc1"
amd64 = "sha256:f3bfccc952685db05b8e314336a1ffa413703aeebcf0150777ab8c4327b655f5"
arm64 = "sha256:57d3c35e72c3b4b7dcf66ea5c149530c605c6b7f53f633ef288c539e5aefd8a3"
[[apps.images]]
service = "runner"
image = "docker.io/eshork/gha-runner"
list = "sha256:d7d6057c02f60b1dcddeaee2f0d7193af329d65e676e4040c735f425ee7d9fc1"
amd64 = "sha256:f3bfccc952685db05b8e314336a1ffa413703aeebcf0150777ab8c4327b655f5"
arm64 = "sha256:57d3c35e72c3b4b7dcf66ea5c149530c605c6b7f53f633ef288c539e5aefd8a3"
[apps.requirements]
mem_mib = 4096
cpus = 2
[apps.permissions]
ports = ["8711:8711/tcp"]
shares = "none by default; a public repository refuses read-write"
internet = true
lan = false
[apps.limits]
cpu_weight = 20
[[apps.data]]
name = "config"
bytes = 67108864
[[apps.data]]
name = "cache"
bytes = 21474836480
[apps.user]
kind = "default app user"

# FileFerry's entry in the official channel (spec-fileferry §8.3; the
# format is spec-app-catalog §3). `lehrdev fileferry release` fills the
# version, the day and the digests and writes the result into official.toml
# in the LehrNAS-apps repository (#209); everything else is edited here, by hand.
[[apps]]
id = "fileferry"
name = "FileFerry"
summary = "Moves an old NAS's files into LehrNAS shares, verified from the drive."
group = "Moving in"
version = "fileferry-2026.1106.2"
released = "2026-11-06"
# The image's repository on Docker Hub, public (spec-fileferry §8.4).
image = "docker.io/eshork/fileferry"
# What the box pins (spec-apps §1): the manifest list's digest, which podman
# records beside the arch's own, so either one matches at install.
[apps.digests]
list = "sha256:83e26f1b28ad1e80018a814dc1d21fed21a7286ffa2798a4b1094ab64be6891a"
amd64 = "sha256:cbd39226f09db50c070ef23da9b95da1da6542d1d1f4db4a81a76ce80689481f"
arm64 = "sha256:d256bfb2129969b4f4617fb6da054203ad0ef1b7624b13bbc55eb02994a267ba"
[apps.requirements]
mem_mib = 1024
cpus = 2
[apps.permissions]
# LAN port:container port, the form the box publishes (#210).
ports = ["8700:8700/tcp"]
shares = "read-write, chosen at install"
internet = false
required = ["shares"]
[[apps.data]]
name = "config"
bytes = 8589934592
[apps.user]
kind = "default app user"
